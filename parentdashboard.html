<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Portal | Evans Higher Secondary School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #e9ecef; min-height: 100vh; display: flex; flex-direction: column; }

    /* Navigation Bar (same as all pages) */
    .navbar { background: #0a2f44; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; border-bottom: 4px solid #d4af37; }
    .navbar .logo img { height: 50px; width: auto; }
    .navbar .nav-links { display: flex; gap: 1.8rem; }
    .navbar .nav-links a { color: white; text-decoration: none; font-weight: 500; padding: 0.5rem 0.2rem 0.7rem; position: relative; }
    .navbar .nav-links a:hover { color: #d4af37; }
    .navbar .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 4px; background: #d4af37; transition: width 0.3s; }
    .navbar .nav-links a:hover::after { width: 100%; }
    .navbar .nav-links a.active { color: #d4af37; font-weight: 600; }
    .navbar .nav-links a.active::after { width: 100%; }
    .navbar .nav-links button { background: #d4af37; color: #0a2f44; border: none; padding: 0.5rem 1.2rem; border-radius: 30px; font-weight: 600; cursor: pointer; }
    .navbar .nav-links button:hover { background: #e6c44d; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

    .welcome-banner { background: white; border-radius: 20px; padding: 1.5rem 2rem; margin-bottom: 2rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .welcome-banner h2 { color: #0a2f44; }
    .card { background: white; border-radius: 20px; padding: 1.5rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
    .card h3 { color: #0a2f44; margin-bottom: 1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.7rem; }

    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .app-card { background: #f8fafc; border-radius: 12px; padding: 1.5rem; border: 1px solid #e2e8f0; }
    .app-card h4 { color: #0a2f44; margin-bottom: 0.8rem; }
    .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 30px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 0.8rem; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .detail-label { color: #64748b; }
    .detail-value { font-weight: 500; color: #1e293b; }

    .btn { background: #0a2f44; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 30px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: #1e4a6b; }

    .footer { background: #0a2f44; color: #ccc; text-align: center; padding: 1.5rem; margin-top: 2rem; }
    .footer a { color: #d4af37; text-decoration: none; }

    @media (max-width: 600px) { .navbar { flex-direction: column; gap: 0.8rem; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><img src="image.png" alt="Evans Higher Secondary School Logo"></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="apply.html">Apply</a>
      <a href="status.html">Check Status</a>
      <a href="register.html">Register</a>
      <a href="login.html" class="admin-link">Login</a>
      <a href="parent-dashboard.html" class="active">Parent Portal</a>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="welcome-banner">
      <div>
        <h2>Welcome, <span id="parentName">Parent</span>!</h2>
        <p style="color:#64748b;">Manage your children's applications below.</p>
      </div>
      <button class="btn" onclick="window.location.href='apply.html'">+ New Application</button>
    </div>

    <div class="card">
      <h3>📋 Your Children's Applications</h3>
      <div id="applicationsContainer" class="app-grid">
        <p>Loading applications...</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Evans Higher Secondary School. All rights reserved.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // ⚠️ Replace with your actual Supabase URL and anon key
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseKey = 'YOUR_ANON_KEY';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Check if parent is logged in
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html?role=parent';
        return null;
      }
      return session;
    }

    // Fetch applications for the parent's email
    async function fetchApplications(parentEmail) {
      const { data, error } = await supabase
        .from('applications')
        .select('*')
        .eq('email', parentEmail)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('applicationsContainer').innerHTML = `<p>Error loading applications: ${error.message}</p>`;
        return;
      }

      renderApplications(data);
    }

    function renderApplications(apps) {
      const container = document.getElementById('applicationsContainer');
      if (!apps || apps.length === 0) {
        container.innerHTML = `<p>No applications found. <a href="apply.html">Submit a new application</a>.</p>`;
        return;
      }

      container.innerHTML = apps.map(app => {
        const statusClass = `status-${app.status}`;
        const statusText = app.status.charAt(0).toUpperCase() + app.status.slice(1);
        return `
          <div class="app-card">
            <h4>${app.student_name}</h4>
            <span class="status-badge ${statusClass}">${statusText}</span>
            <div class="detail-row"><span class="detail-label">Grade:</span><span class="detail-value">${app.grade_applying}</span></div>
            <div class="detail-row"><span class="detail-label">Submitted:</span><span class="detail-value">${new Date(app.created_at).toLocaleDateString()}</span></div>
            <div class="detail-row"><span class="detail-label">App ID:</span><span class="detail-value">#${app.id}</span></div>
            ${app.status === 'approved' ? '<button class="btn" onclick="alert(\'Admission letter for ' + app.student_name + ' will be available soon.\')">📜 View Letter</button>' : ''}
          </div>
        `;
      }).join('');
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    // Initialize
    (async () => {
      const session = await checkAuth();
      if (!session) return;

      const parentEmail = session.user.email;
      document.getElementById('parentName').textContent = parentEmail; // Show email for now (you could store a name in user metadata)
      await fetchApplications(parentEmail);
    })();
  </script>
</body>
</html>
