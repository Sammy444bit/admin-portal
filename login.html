<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Evans Higher Secondary School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #e9ecef; min-height: 100vh; display: flex; flex-direction: column; }
    
    .navbar { background: #0a2f44; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; color: white; border-bottom: 4px solid #d4af37; }
    .navbar .logo img { height: 50px; width: auto; }
    .navbar .nav-links { display: flex; gap: 1.8rem; }
    .navbar .nav-links a { color: white; text-decoration: none; font-weight: 500; padding: 0.5rem 0.2rem 0.7rem; position: relative; }
    .navbar .nav-links a:hover { color: #d4af37; }
    .navbar .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 4px; background: #d4af37; transition: width 0.3s; }
    .navbar .nav-links a:hover::after { width: 100%; }
    .navbar .nav-links a.active { color: #d4af37; font-weight: 600; }
    .navbar .nav-links a.active::after { width: 100%; }
    .navbar .nav-links a.admin-link { background: #d4af37; color: #0a2f44; padding: 0.5rem 1.2rem; border-radius: 30px; }
    .navbar .nav-links a.admin-link::after { display: none; }
    .navbar .nav-links a.admin-link:hover { background: #e6c44d; }
    
    .container { max-width: 550px; margin: 3rem auto; padding: 0 1.5rem; flex: 1; }
    .login-card { background: white; border-radius: 24px; box-shadow: 0 20px 35px -8px rgba(0,0,0,0.15); overflow: hidden; }
    .card-header { background: #0a2f44; padding: 1.8rem 2rem; text-align: center; color: white; border-bottom: 4px solid #d4af37; }
    .card-header h2 { font-size: 1.8rem; text-transform: uppercase; }
    .card-body { padding: 2.5rem; }
    
    .tab-container { display: flex; margin-bottom: 2rem; border-bottom: 2px solid #e2e8f0; }
    .tab { flex: 1; text-align: center; padding: 0.8rem 0.2rem; cursor: pointer; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; font-size: 0.95rem; }
    .tab.active { color: #0a2f44; border-bottom: 3px solid #d4af37; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input { width: 100%; padding: 0.9rem; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 1rem; }
    button { background: #0a2f44; color: white; border: none; padding: 1rem; width: 100%; font-size: 1.1rem; font-weight: 600; border-radius: 40px; cursor: pointer; }
    button:hover { background: #1e4a6b; }
    #loginMessage { margin-top: 1.5rem; padding: 0.75rem; border-radius: 8px; text-align: center; }
    .register-link { text-align: center; margin-top: 1.5rem; }
    .footer { background: #0a2f44; color: #ccc; text-align: center; padding: 1.5rem; margin-top: 2rem; }
    @media (max-width: 600px) { .navbar { flex-direction: column; } .card-body { padding: 1.5rem; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><img src="image.png" alt="Evans Higher Secondary School Logo"></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="apply.html">Apply</a>
      <a href="status.html">Check Status</a>
      <a href="register.html">Register</a>
      <a href="login.html" class="admin-link active">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="login-card">
      <div class="card-header">
        <h2>Secure Login</h2>
        <p>Evans Higher Secondary School</p>
      </div>
      <div class="card-body">
        <div class="tab-container">
          <div class="tab active" onclick="switchRole('student')">🎓 Student</div>
          <div class="tab" onclick="switchRole('parent')">👨‍👩‍👧 Parent</div>
          <div class="tab" onclick="switchRole('admin')">🛡️ Admin</div>
        </div>
        
        <form id="loginForm">
          <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="your@email.com" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
          <button type="submit">🔐 Sign In</button>
          <div id="loginMessage"></div>
        </form>
        
        <div class="register-link">
          <span id="registerText">Don't have an account?</span> <a href="register.html" id="registerLink">Register here</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Evans Higher Secondary School. All rights reserved.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://jrjsgfemezusuwcondku.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyanNnZmVtZXp1c3V3Y29uZGt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNzA5ODYsImV4cCI6MjA5MTc0Njk4Nn0.55-KRYeoa3DDuZA5g4js5WWPB10yCKNf5gWtcwRH3V8';
    const supabase = createClient(supabaseUrl, supabaseKey);

    let currentRole = 'student';

    window.switchRole = function(role) {
      currentRole = role;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      if (role === 'student') document.querySelectorAll('.tab')[0].classList.add('active');
      else if (role === 'parent') document.querySelectorAll('.tab')[1].classList.add('active');
      else document.querySelectorAll('.tab')[2].classList.add('active');
      
      const registerText = document.getElementById('registerText');
      const registerLink = document.getElementById('registerLink');
      if (role === 'student') {
        registerText.textContent = 'New student?';
        registerLink.textContent = 'Apply for admission';
        registerLink.href = 'apply.html';
      } else if (role === 'parent') {
        registerText.textContent = 'Don\'t have a parent account?';
        registerLink.textContent = 'Register here';
        registerLink.href = 'register.html';
      } else {
        registerText.textContent = 'Admin access only.';
        registerLink.textContent = 'Contact system admin';
        registerLink.href = '#';
        registerLink.onclick = (e) => { e.preventDefault(); alert('Admin accounts are created by the system administrator.'); };
      }
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const msgDiv = document.getElementById('loginMessage');
      
      if (!email || !password) {
        msgDiv.innerHTML = '⚠️ Please enter both email and password.';
        msgDiv.style.backgroundColor = '#fef3c7';
        msgDiv.style.color = '#92400e';
        return;
      }

      msgDiv.innerHTML = '⏳ Authenticating...';
      msgDiv.style.backgroundColor = '#eff6ff';
      msgDiv.style.color = '#1e40af';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        msgDiv.innerHTML = `❌ Login failed: ${error.message}`;
        msgDiv.style.backgroundColor = '#fee2e2';
        msgDiv.style.color = '#991b1b';
        return;
      }

      msgDiv.innerHTML = '✅ Login successful! Redirecting...';
      msgDiv.style.backgroundColor = '#f0fdf4';
      msgDiv.style.color = '#166534';

      // REAL REDIRECT based on selected role
      setTimeout(() => {
        if (currentRole === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else if (currentRole === 'student') {
          window.location.href = 'student-dashboard.html';
        } else {
          // Parent portal placeholder
           window.location.href = 'parent-dashboard.html';
        }
      }, 1000);
    });

    // Auto-redirect if already logged in
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      console.log('Already logged in, redirecting...');
      // You could redirect to a default page or check user role from database
      // For now, we'll just log it
    }
    // After successful sign in:
const userEmail = data.user.email;
const email = data.user.email;

if (email.includes('admin')) {
  window.location.href = 'admin-dashboard.html';
} else if (email.includes('staff')) {
  window.location.href = 'staff-dashboard.html';
} else {
  // Default for parents (and others) – they go to parent dashboard
  window.location.href = 'parent-dashboard.html';
}

// Determine role by email pattern (you can customize these)
if (userEmail.includes('admin')) {
  window.location.href = 'admin-dashboard.html';
} else if (userEmail.includes('staff')) {
  window.location.href = 'staff-dashboard.html';
} else if (userEmail.includes('parent')) {
  window.location.href = 'parent-dashboard.html';
} else {
  // Default fallback – maybe student or handle unknown
  window.location.href = 'student-dashboard.html';
}
  
  </script>
</body>
</html>
